<!DOCTYPE html>
<html lang="en">
<head>
    <title>OpenSprinkler Firmware Update</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
    :root{
      --bg:#f4f5f7; --fg:#111827; --muted:#6b7280;
      --card:#ffffff; --border:#e5e7eb; --input-border:#d1d5db;
      --accent:#2563eb; --accent-hover:#1d4ed8; --accent-fg:#ffffff;
      --head-bg:#f7f7f7; --head-fg:#262626;
      --focus:rgba(37,99,235,.22);
      --imp-bg:#fff7ed; --imp-fg:#7c2d12; --imp-accent:#ea580c;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0b1220; --fg:#e6eaf2; --muted:#9aa4b8;
        --card:#111a2e; --border:#2a3344; --input-border:#3a4658;
        --accent:#3b82f6; --accent-hover:#60a5fa; --accent-fg:#ffffff;
        --head-bg:#1b2130; --head-fg:#cbd5e1;
        --focus:rgba(59,130,246,.30);
        --imp-bg:#3a2412; --imp-fg:#fed7aa; --imp-accent:#fb923c;
      }
    }
    *{ box-sizing:border-box; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--fg); margin:0; padding:24px 16px; line-height:1.45;
    }
    main{ max-width:560px; margin:0 auto; }
    h1{ text-align:center; font-size:22px; margin:0 0 22px; }
    .important{
      background:var(--imp-bg); color:var(--imp-fg);
      border-left:4px solid var(--imp-accent); border-radius:6px;
      padding:12px 16px; margin-bottom:22px; font-size:15px;
    }
    .important b{ color:var(--imp-accent); letter-spacing:.3px; }
    section{
      margin-bottom:16px; background:var(--card);
      border:1px solid var(--border); border-radius:8px; overflow:hidden;
    }
    section[hidden]{ display:none; }
    section > h2{
      margin:0; padding:10px 16px;
      background:var(--head-bg); color:var(--head-fg); border-bottom:1px solid var(--border);
      font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    }
    .body{ padding:16px; }
    .field{ margin-bottom:14px; }
    .field:last-of-type{ margin-bottom:0; }
    label{ display:block; font-weight:600; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input[type="password"],input[type="file"],select{
      width:100%; padding:10px 12px; font-size:16px; color:inherit;
      background:transparent; border:1px solid var(--input-border); border-radius:6px;
    }
    input:focus,select:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--focus); outline:none; }
    input[type="file"]::file-selector-button{
      font-weight:600; color:var(--accent); background:transparent;
      border:1px solid var(--accent); border-radius:6px; padding:8px 12px; margin-right:10px; cursor:pointer;
    }
    button{
      width:100%; padding:12px; font-size:16px; font-weight:600;
      color:var(--accent-fg); background:var(--accent); border:none; border-radius:6px; cursor:pointer;
    }
    button:hover:not(:disabled){ background:var(--accent-hover); }
    button.secondary{ color:var(--accent); background:transparent; border:1px solid var(--accent); }
    button.secondary:hover:not(:disabled){ background:var(--focus); }
    button + button{ margin-top:8px; }
    button:disabled{ opacity:.5; cursor:default; }
    .help{ color:var(--muted); font-size:13px; margin-top:6px; }
    #msg{ text-align:center; font-weight:600; margin:18px 0; min-height:20px; }
    progress{ width:100%; height:12px; }
    </style>
</head>
<body>

<main>
    <h1>OpenSprinkler Firmware Update</h1>

	<div class="important"><b>IMPORTANT:</b> Please back up your configuration before proceeding. In the OpenSprinkler App/UI, select <b>Export Configurations</b> from the side menu.</div>

	<section>
		<h2>Device Password</h2>
		<div class="body">
			<input type="password" id="pw" autocomplete="current-password" aria-label="Device password">
		</div>
	</section>

	<section id="online_section" hidden>
		<h2>One-Click Firmware Update</h2>
		<div class="body">
			<div class="field">
				<select id="release" aria-label="Firmware version" disabled><option>Checking for releases...</option></select>
				<p class="help" id="release_details"></p>
			</div>
			<button type="button" class="secondary" id="btn_refresh">Obtain Firmware List</button>
			<button type="button" id="btn_install" disabled>Install Selected Version</button>
		</div>
	</section>

	<section>
		<h2>Manual Firmware Upload</h2>
		<div class="body">
			<div class="field">
				<label for="file" id="file_label">Firmware File</label>
				<input type="file" name="file" id="file">
			</div>
			<button type="button" id="btn_submit">Upload Selected Firmware</button>
		</div>
	</section>

	<p id='msg' aria-live="polite"></p>
	<progress id="progress" value="0" max="100" hidden></progress>
</main>

<script>
    /**
     * A correct, self-contained MD5 implementation.
     * Original by Joseph Myers and Paul Johnston.
     */
    function md5(string) {
        function RotateLeft(lValue, iShiftBits) {
            return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
        }

        function AddUnsigned(lX, lY) {
            var lX4, lY4, lX8, lY8, lResult;
            lX8 = (lX & 0x80000000);
            lY8 = (lY & 0x80000000);
            lX4 = (lX & 0x40000000);
            lY4 = (lY & 0x40000000);
            lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
            if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
            if (lX4 | lY4) {
                if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
                else return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
            } else return (lResult ^ lX8 ^ lY8);
        }

        function F(x, y, z) { return (x & y) | ((~x) & z); }
        function G(x, y, z) { return (x & z) | (y & (~z)); }
        function H(x, y, z) { return (x ^ y ^ z); }
        function I(x, y, z) { return (y ^ (x | (~z))); }

        function FF(a, b, c, d, x, s, ac) {
            a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b, c, d), x), ac));
            return AddUnsigned(RotateLeft(a, s), b);
        }

        function GG(a, b, c, d, x, s, ac) {
            a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b, c, d), x), ac));
            return AddUnsigned(RotateLeft(a, s), b);
        }

        function HH(a, b, c, d, x, s, ac) {
            a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b, c, d), x), ac));
            return AddUnsigned(RotateLeft(a, s), b);
        }

        function II(a, b, c, d, x, s, ac) {
            a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b, c, d), x), ac));
            return AddUnsigned(RotateLeft(a, s), b);
        }

        function ConvertToWordArray(string) {
            var lWordCount;
            var lMessageLength = string.length;
            var lNumberOfWords_temp1 = lMessageLength + 8;
            var lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64;
            var lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16;
            var lWordArray = Array(lNumberOfWords - 1);
            var lBytePosition = 0;
            var lByteCount = 0;
            while (lByteCount < lMessageLength) {
                lWordCount = (lByteCount - (lByteCount % 4)) / 4;
                lBytePosition = (lByteCount % 4) * 8;
                lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
                lByteCount++;
            }
            lWordCount = (lByteCount - (lByteCount % 4)) / 4;
            lBytePosition = (lByteCount % 4) * 8;
            lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
            lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
            lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
            return lWordArray;
        }

        function WordToHex(lValue) {
            var WordToHexValue = "", WordToHexValue_temp = "", lByte, lCount;
            for (lCount = 0; lCount <= 3; lCount++) {
                lByte = (lValue >>> (lCount * 8)) & 255;
                WordToHexValue_temp = "0" + lByte.toString(16);
                WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length - 2, 2);
            }
            return WordToHexValue;
        }

        function Utf8Encode(string) {
            string = string.replace(/\r\n/g, "\n");
            var utftext = "";
            for (var n = 0; n < string.length; n++) {
                var c = string.charCodeAt(n);
                if (c < 128) {
                    utftext += String.fromCharCode(c);
                } else if ((c > 127) && (c < 2048)) {
                    utftext += String.fromCharCode((c >> 6) | 192);
                    utftext += String.fromCharCode((c & 63) | 128);
                } else {
                    utftext += String.fromCharCode((c >> 12) | 224);
                    utftext += String.fromCharCode(((c >> 6) & 63) | 128);
                    utftext += String.fromCharCode((c & 63) | 128);
                }
            }
            return utftext;
        }

        var x = Array();

        var S11 = 7, S12 = 12, S13 = 17, S14 = 22;
        var S21 = 5, S22 = 9, S23 = 14, S24 = 20;
        var S31 = 4, S32 = 11, S33 = 16, S34 = 23;
        var S41 = 6, S42 = 10, S43 = 15, S44 = 21;

        string = Utf8Encode(string);
        x = ConvertToWordArray(string);
        a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;

        for (k = 0; k < x.length; k += 16) {
            AA = a; BB = b; CC = c; DD = d;
            a = FF(a, b, c, d, x[k + 0], S11, 0xD76AA478);
            d = FF(d, a, b, c, x[k + 1], S12, 0xE8C7B756);
            c = FF(c, d, a, b, x[k + 2], S13, 0x242070DB);
            b = FF(b, c, d, a, x[k + 3], S14, 0xC1BDCEEE);
            a = FF(a, b, c, d, x[k + 4], S11, 0xF57C0FAF);
            d = FF(d, a, b, c, x[k + 5], S12, 0x4787C62A);
            c = FF(c, d, a, b, x[k + 6], S13, 0xA8304613);
            b = FF(b, c, d, a, x[k + 7], S14, 0xFD469501);
            a = FF(a, b, c, d, x[k + 8], S11, 0x698098D8);
            d = FF(d, a, b, c, x[k + 9], S12, 0x8B44F7AF);
            c = FF(c, d, a, b, x[k + 10], S13, 0xFFFF5BB1);
            b = FF(b, c, d, a, x[k + 11], S14, 0x895CD7BE);
            a = FF(a, b, c, d, x[k + 12], S11, 0x6B901122);
            d = FF(d, a, b, c, x[k + 13], S12, 0xFD987193);
            c = FF(c, d, a, b, x[k + 14], S13, 0xA679438E);
            b = FF(b, c, d, a, x[k + 15], S14, 0x49B40821);
            a = GG(a, b, c, d, x[k + 1], S21, 0xF61E2562);
            d = GG(d, a, b, c, x[k + 6], S22, 0xC040B340);
            c = GG(c, d, a, b, x[k + 11], S23, 0x265E5A51);
            b = GG(b, c, d, a, x[k + 0], S24, 0xE9B6C7AA);
            a = GG(a, b, c, d, x[k + 5], S21, 0xD62F105D);
            d = GG(d, a, b, c, x[k + 10], S22, 0x2441453);
            c = GG(c, d, a, b, x[k + 15], S23, 0xD8A1E681);
            b = GG(b, c, d, a, x[k + 4], S24, 0xE7D3FBC8);
            a = GG(a, b, c, d, x[k + 9], S21, 0x21E1CDE6);
            d = GG(d, a, b, c, x[k + 14], S22, 0xC33707D6);
            c = GG(c, d, a, b, x[k + 3], S23, 0xF4D50D87);
            b = GG(b, c, d, a, x[k + 8], S24, 0x455A14ED);
            a = GG(a, b, c, d, x[k + 13], S21, 0xA9E3E905);
            d = GG(d, a, b, c, x[k + 2], S22, 0xFCEFA3F8);
            c = GG(c, d, a, b, x[k + 7], S23, 0x676F02D9);
            b = GG(b, c, d, a, x[k + 12], S24, 0x8D2A4C8A);
            a = HH(a, b, c, d, x[k + 5], S31, 0xFFFA3942);
            d = HH(d, a, b, c, x[k + 8], S32, 0x8771F681);
            c = HH(c, d, a, b, x[k + 11], S33, 0x6D9D6122);
            b = HH(b, c, d, a, x[k + 14], S34, 0xFDE5380C);
            a = HH(a, b, c, d, x[k + 1], S31, 0xA4BEEA44);
            d = HH(d, a, b, c, x[k + 4], S32, 0x4BDECFA9);
            c = HH(c, d, a, b, x[k + 7], S33, 0xF6BB4B60);
            b = HH(b, c, d, a, x[k + 10], S34, 0xBEBFBC70);
            a = HH(a, b, c, d, x[k + 13], S31, 0x289B7EC6);
            d = HH(d, a, b, c, x[k + 0], S32, 0xEAA127FA);
            c = HH(c, d, a, b, x[k + 3], S33, 0xD4EF3085);
            b = HH(b, c, d, a, x[k + 6], S34, 0x4881D05);
            a = HH(a, b, c, d, x[k + 9], S31, 0xD9D4D039);
            d = HH(d, a, b, c, x[k + 12], S32, 0xE6DB99E5);
            c = HH(c, d, a, b, x[k + 15], S33, 0x1FA27CF8);
            b = HH(b, c, d, a, x[k + 2], S34, 0xC4AC5665);
            a = II(a, b, c, d, x[k + 0], S41, 0xF4292244);
            d = II(d, a, b, c, x[k + 7], S42, 0x432AFF97);
            c = II(c, d, a, b, x[k + 14], S43, 0xAB9423A7);
            b = II(b, c, d, a, x[k + 5], S44, 0xFC93A039);
            a = II(a, b, c, d, x[k + 12], S41, 0x655B59C3);
            d = II(d, a, b, c, x[k + 3], S42, 0x8F0CCC92);
            c = II(c, d, a, b, x[k + 10], S43, 0xFFEFF47D);
            b = II(b, c, d, a, x[k + 1], S44, 0x85845DD1);
            a = II(a, b, c, d, x[k + 8], S41, 0x6FA87E4F);
            d = II(d, a, b, c, x[k + 15], S42, 0xFE2CE6E0);
            c = II(c, d, a, b, x[k + 6], S43, 0xA3014314);
            b = II(b, c, d, a, x[k + 13], S44, 0x4E0811A1);
            a = II(a, b, c, d, x[k + 4], S41, 0xF7537E82);
            d = II(d, a, b, c, x[k + 11], S42, 0xBD3AF235);
            c = II(c, d, a, b, x[k + 2], S43, 0x2AD7D2BB);
            b = II(b, c, d, a, x[k + 9], S44, 0xEB86D391);
            a = AddUnsigned(a, AA);
            b = AddUnsigned(b, BB);
            c = AddUnsigned(c, CC);
            d = AddUnsigned(d, DD);
        }
        var temp = WordToHex(a) + WordToHex(b) + WordToHex(c) + WordToHex(d);
        return temp.toLowerCase();
    }

	function sha256_bytes(bytes) {
		const constants = [
			0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
			0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
			0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
			0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
			0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
			0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
			0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
			0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
		];
		const state = new Uint32Array([
			0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
			0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19
		]);
		const words = new Uint32Array(64);
		const total = Math.ceil((bytes.length + 9) / 64) * 64;
		const bitHigh = Math.floor(bytes.length / 0x20000000);
		const bitLow = (bytes.length << 3) >>> 0;
		function byte_at(position) {
			if (position < bytes.length) return bytes[position];
			if (position === bytes.length) return 0x80;
			if (position >= total - 8) {
				const offset = position - (total - 8);
				const value = offset < 4 ? bitHigh : bitLow;
				return (value >>> ((3 - (offset & 3)) * 8)) & 0xff;
			}
			return 0;
		}
		function rotate_right(value, bits) {
			return (value >>> bits) | (value << (32 - bits));
		}
		for (let block = 0; block < total; block += 64) {
			for (let i = 0; i < 16; i++) {
				const position = block + i * 4;
				words[i] = ((byte_at(position) << 24) | (byte_at(position + 1) << 16) |
					(byte_at(position + 2) << 8) | byte_at(position + 3)) >>> 0;
			}
			for (let i = 16; i < 64; i++) {
				const s0 = rotate_right(words[i - 15], 7) ^ rotate_right(words[i - 15], 18) ^
					(words[i - 15] >>> 3);
				const s1 = rotate_right(words[i - 2], 17) ^ rotate_right(words[i - 2], 19) ^
					(words[i - 2] >>> 10);
				words[i] = (words[i - 16] + s0 + words[i - 7] + s1) >>> 0;
			}
			let a=state[0],b=state[1],c=state[2],d=state[3];
			let e=state[4],f=state[5],g=state[6],h=state[7];
			for (let i = 0; i < 64; i++) {
				const sum1 = rotate_right(e, 6) ^ rotate_right(e, 11) ^ rotate_right(e, 25);
				const choice = (e & f) ^ (~e & g);
				const temp1 = (h + sum1 + choice + constants[i] + words[i]) >>> 0;
				const sum0 = rotate_right(a, 2) ^ rotate_right(a, 13) ^ rotate_right(a, 22);
				const majority = (a & b) ^ (a & c) ^ (b & c);
				const temp2 = (sum0 + majority) >>> 0;
				h=g; g=f; f=e; e=(d+temp1)>>>0; d=c; c=b; b=a; a=(temp1+temp2)>>>0;
			}
			state[0]=(state[0]+a)>>>0; state[1]=(state[1]+b)>>>0;
			state[2]=(state[2]+c)>>>0; state[3]=(state[3]+d)>>>0;
			state[4]=(state[4]+e)>>>0; state[5]=(state[5]+f)>>>0;
			state[6]=(state[6]+g)>>>0; state[7]=(state[7]+h)>>>0;
		}
		return Array.from(state, function(value) {
			return value.toString(16).padStart(8, '0');
		}).join('');
	}

	async function sha256_file(file) {
		const bytes = new Uint8Array(await file.arrayBuffer());
		if (window.crypto && window.crypto.subtle) {
			try {
				const digest = await window.crypto.subtle.digest('SHA-256', bytes);
				return Array.from(new Uint8Array(digest), function(value) {
					return value.toString(16).padStart(2, '0');
				}).join('');
			} catch (error) {}
		}
		return sha256_bytes(bytes);
	}


    // --- Main page logic ---
    function id(s) { return document.getElementById(s); }
    const apiBase = '//' + window.location.hostname + ':8080/update';
    let deviceInfo = null;
    let catalogBytes = null;
    let catalogSignature = '';
    let releases = [];

    function show_msg(text, color) {
        const message = id('msg');
        message.textContent = text;
        message.style.color = color || 'inherit';
    }

    function set_busy(busy) {
        id('btn_install').disabled = busy || !releases.length;
        id('btn_refresh').disabled = busy;
        id('btn_submit').disabled = busy;
		id('release').disabled = busy || !releases.length;
    }

		function wait(milliseconds) {
			return new Promise(function(resolve) { setTimeout(resolve, milliseconds); });
		}

		async function fetch_with_timeout(url, options, timeout) {
			const controller = new AbortController();
			const timer = setTimeout(function() { controller.abort(); }, timeout || 15000);
			try {
				return await fetch(url, Object.assign({}, options || {}, {signal: controller.signal}));
			} catch (error) {
				if (error.name === 'AbortError') throw new Error('The request timed out.');
				throw error;
			} finally {
				clearTimeout(timer);
			}
		}

		async function fetch_with_retry(url, options) {
			let failure;
			for (let attempt = 1; attempt <= 3; attempt++) {
				try {
					const response = await fetch_with_timeout(url, options, 20000);
				if (response.ok || response.status < 500) return response;
				failure = new Error('Server returned HTTP ' + response.status + '.');
			} catch (error) {
				failure = error;
			}
			if (attempt < 3) await wait(attempt * 500);
		}
		throw failure;
	}

    async function request_token() {
		const password = id('pw').value;
		if (!password && !confirm('You did not input a device password. Continue?')) throw new Error('Cancelled');
		const body = new URLSearchParams({pw: password ? md5(password) : ''});
		const response = await fetch_with_timeout(apiBase + '/auth', {method: 'POST', body});
        const data = await response.json();
        if (data.result !== 1 || !data.token) throw new Error('Authentication failed. Check the device password.');
        return data.token;
    }

    async function load_releases() {
        set_busy(true);
        show_msg('Loading update information...', 'gray');
        try {
			const infoResponse = await fetch_with_timeout(apiBase + '/info', {cache: 'no-store'});
            if (!infoResponse.ok) throw new Error('The controller did not return update information.');
            deviceInfo = await infoResponse.json();
            id('file').accept = deviceInfo.extension || '';
            id('file_label').textContent = 'Firmware File (' + (deviceInfo.extension || 'device firmware') + ')';
			id('online_section').hidden = !!deviceInfo.ap_mode;
			if (deviceInfo.ap_mode) {
				releases = [];
				show_msg('', 'inherit');
				return;
			}
			show_msg('Checking for firmware releases...', 'gray');
            const select = id('release');
            select.textContent = '';
            releases = [];
            if (!deviceInfo.configured) {
                select.add(new Option('Online updates are not configured', ''));
                select.disabled = true;
                show_msg('Manual firmware upload is available below.', 'gray');
                return;
            }

            const base = deviceInfo.base_url.replace(/\/$/, '');
            const responses = await Promise.all([
                fetch_with_retry(base + '/v1/manifest.json', {cache: 'no-store'}),
                fetch_with_retry(base + '/v1/manifest.sig', {cache: 'no-store'})
            ]);
            if (!responses[0].ok || !responses[1].ok) throw new Error('The release catalog is unavailable.');
            catalogBytes = new Uint8Array(await responses[0].arrayBuffer());
            catalogSignature = (await responses[1].text()).trim();
            const catalog = JSON.parse(new TextDecoder().decode(catalogBytes));
            if (catalog.schema !== 1 || !Array.isArray(catalog.releases) || !catalogSignature)
                throw new Error('The release catalog format is invalid.');

            catalog.releases.forEach(function(release) {
                const artifact = release.targets && release.targets[deviceInfo.target];
				if (!artifact || typeof artifact.file !== 'string' ||
					!artifact.file.startsWith('/v1/releases/') || !artifact.size) return;
                releases.push(Object.assign({}, release, {
                    label: release_label(release),
                    artifact: artifact,
                    url: new URL(artifact.file, base).href
                }));
            });
            releases.slice(0, 3).forEach(function(release, index) {
                select.add(new Option((index === 0 ? 'Latest: ' : '') + release.label, release.id));
            });
            releases = releases.slice(0, 3);
            select.disabled = !releases.length;
            update_release_details();
            show_msg(releases.length ? 'Firmware releases are available.' : 'No compatible releases found.', releases.length ? 'green' : 'red');
        } catch (error) {
            releases = [];
            show_msg('Unable to check for updates: ' + error.message, 'red');
        } finally {
            set_busy(false);
        }
    }

    function selected_release() {
        return releases.find(function(release) { return release.id === id('release').value; });
    }

    function release_label(release) {
        const version = String(release.version);
        return /^\d{3}$/.test(version) ? version.split('').join('.') + '(' + release.build + ')' : release.id;
    }

    function update_release_details() {
        const release = selected_release();
        id('release_details').textContent = release ? Math.ceil(release.artifact.size / 1024) + ' KB' : '';
    }

    function download_firmware(release, attempt) {
		attempt = attempt || 1;
        return new Promise(function(resolve, reject) {
            const xhr = new XMLHttpRequest();
			function retry(error) {
				if (attempt >= 3) return reject(error);
				show_msg('Firmware download failed; retrying (' + attempt + '/3)...', 'gray');
				setTimeout(function() {
					download_firmware(release, attempt + 1).then(resolve, reject);
				}, attempt * 500);
			}
            xhr.open('GET', release.url, true);
            xhr.responseType = 'blob';
			xhr.timeout = 60000;
            xhr.onprogress = function(event) {
                if (!event.lengthComputable) return;
                const pct = Math.round(event.loaded * 100 / event.total);
                id('progress').hidden = false;
                id('progress').value = pct;
                show_msg('Downloading firmware (' + pct + '%)...', 'gray');
            };
            xhr.onload = function() {
				if (xhr.status >= 500) return retry(new Error('Firmware download failed.'));
				if (xhr.status !== 200) return reject(new Error('Firmware download failed.'));
                if (!xhr.response || xhr.response.size !== release.artifact.size)
                    return reject(new Error('Downloaded firmware size does not match the catalog.'));
                resolve(xhr.response);
            };
			xhr.onerror = function() { retry(new Error('A network error occurred during firmware download.')); };
			xhr.ontimeout = function() { retry(new Error('Firmware download timed out.')); };
            xhr.send();
        });
    }

    async function prepare_update(release, allowDowngrade, token) {
        const query = new URLSearchParams({
            token: token,
            id: release.id,
            sig: catalogSignature,
            allow_downgrade: allowDowngrade ? '1' : '0'
        });
		const response = await fetch_with_timeout(apiBase + '/prepare?' + query, {
			method: 'POST',
			headers: {'Content-Type': 'application/octet-stream'},
			body: catalogBytes
		}, 20000);
        const result = await response.json();
        if (result.result !== 1 || !result.upload_token)
            throw new Error(result.item || 'The controller rejected the signed release catalog.');
        return result.upload_token;
    }

	function upload_firmware(file, filename, token, verified, sha256) {
        return new Promise(function(resolve, reject) {
            const data = new FormData();
            data.append('file', file, filename);
            const xhr = new XMLHttpRequest();
            const endpoint = verified ? '/upload' : '';
			const query = new URLSearchParams({token: token});
			if (!verified) {
				query.set('size', file.size);
				query.set('sha256', sha256);
			}
			xhr.open('POST', apiBase + endpoint + '?' + query.toString(), true);
            xhr.timeout = 300000;
            xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                if (xhr.status !== 200) return reject(new Error('Could not connect to the update server.'));
                try {
                    const result = JSON.parse(xhr.responseText);
                    if (result.result !== 1) return reject(new Error(result.item || 'Firmware upload failed.'));
                    resolve();
                } catch (error) { reject(new Error('The device returned an invalid response.')); }
            };
            xhr.upload.onprogress = function(event) {
                if (!event.lengthComputable) return;
                const pct = Math.round(event.loaded * 100 / event.total);
                id('progress').hidden = false;
                id('progress').value = pct;
                show_msg('Uploading firmware (' + pct + '%)...', 'gray');
            };
            xhr.onerror = function() { reject(new Error('A network error occurred during upload.')); };
            xhr.ontimeout = function() { reject(new Error('Firmware upload timed out.')); };
            xhr.send(data);
        });
    }

    id('release').addEventListener('change', update_release_details);
    id('btn_refresh').addEventListener('click', load_releases);
    id('btn_install').addEventListener('click', async function() {
        const release = selected_release();
        if (!release) return;
        const newer = release.version > deviceInfo.current_version ||
            (release.version === deviceInfo.current_version && release.build > deviceInfo.current_build);
        let allowDowngrade = false;
        if (!newer) {
            allowDowngrade = confirm('This version is not newer than the installed firmware. Install it anyway?');
            if (!allowDowngrade) return;
        } else if (!confirm('Install firmware ' + release.label + ' and reboot the controller?')) return;
        set_busy(true);
        try {
            const firmware = await download_firmware(release);
            const token = await request_token();
            const uploadToken = await prepare_update(release, allowDowngrade, token);
            const filename = release.artifact.file.split('/').pop();
            await upload_firmware(firmware, filename, uploadToken, true);
            show_msg('Update successful. The controller is rebooting.', 'green');
            id('pw').value = '';
        } catch (error) {
            if (error.message !== 'Cancelled') show_msg(error.message, 'red');
        } finally {
            set_busy(false);
        }
    });

    id('btn_submit').addEventListener('click', async function() {
        const files = id('file').files;
        if (!files.length) {
            show_msg('Please select a firmware file.', 'red');
            return;
        }
        set_busy(true);
        try {
			const file = files[0];
			const expected = deviceInfo && deviceInfo.extension;
			if (expected && !file.name.endsWith(expected)) throw new Error('Select a ' + expected + ' firmware file for this controller.');
			show_msg('Calculating firmware checksum...', 'gray');
			const sha256 = await sha256_file(file);
			const token = await request_token();
			await upload_firmware(file, file.name, token, false, sha256);
            show_msg('Update successful. The controller is rebooting.', 'green');
            id('pw').value = '';
        } catch (error) {
            if (error.message !== 'Cancelled') show_msg(error.message, 'red');
        } finally {
            set_busy(false);
        }
    });

    load_releases();
</script>

</body>
</html>
