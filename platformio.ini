; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .

[env:os3x_esp8266]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	symlink://external/OpenThings-Framework-Firmware-Library
	;https://github.com/OpenThingsIO/OpenThings-Framework-Firmware-Library @ ^0.2.0
; ignore html2raw.cpp source file for firmware compilation (external helper program)
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
upload_speed = 460800
monitor_speed = 115200
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
build_flags = -DARP_TABLE_SIZE=40
;build_flags = -DENABLE_DEBUG

; OpenSprinkler v4.0 uses an ESP32-C6 and Arduino-ESP32 Core 3. The platform
; release is pinned so firmware builds do not change with upstream updates.
[env:os4_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
extra_scripts = pre:run_prebuild.py
lib_ldf_mode = deep
lib_deps =
	https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/4.2.0.zip
	knolleary/PubSubClient @ ^2.8
	sui77/rc-switch @ ^2.6.3
	symlink://external/OpenThings-Framework-Firmware-Library
build_src_filter = +<*> +<api/*> +<boards/*> +<core/*> +<drivers/*> +<platform/*> +<sensors/*> +<services/*> +<storage/*> +<util/*> -<html/*> -<tests/*> --<external/*>
board_build.partitions = os4.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 460800
monitor_speed = 115200
; ThingPulse references Wire1, but ESP32-C6 exposes only one HP I2C bus.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DWire1=Wire

; The following env is for syntax highlighting only,
; it is NOT for building the firmware for Linux.
; To build the firmware for Linux, please follow:
; https://openthings.freshdesk.com/support/solutions/articles/5000631599
[env:linux]
platform = native
build_flags =
	${env.build_flags}
	-DOSPI

; The following env is for syntax highlighting only,
; it is NOT for building the firmware for Linux.
; To build the firmware for Linux, please follow:
; https://openthings.freshdesk.com/support/solutions/articles/5000631599
[env:demo]
platform = native
build_flags =
	${env.build_flags}
	-DDEMO
